# 로컬 개발용 구성 (명세 8.2절)
#
# 로컬에서부터 PostgreSQL을 Docker로 띄워 AWS(RDS)와 동작을 동일하게 맞춘다.
# "로컬에서만 되던 게 AWS에서 안 되는" 문제를 미리 차단하기 위함이다.
#
# 프론트엔드는 이 구성에 포함하지 않는다 — Vercel 배포가 전제이고(8.3절),
# 로컬에서는 `npm run dev`의 HMR을 쓰는 편이 개발 경험이 낫다.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: subagent_viz
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # healthcheck가 없으면 backend가 "컨테이너는 떴지만 아직 연결은 못 받는"
    # PostgreSQL에 접속을 시도하다 죽는다. 명세 8.2절에는 없으나 필수다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d subagent_viz"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/subagent_viz
      WS_ALLOWED_ORIGIN: http://localhost:3000
      API_KEY: change-me-local-dev-key
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      # 업로드된 glTF 모델을 컨테이너 재생성 후에도 보존한다.
      # AWS 전환 시 이 자리가 EBS 마운트 또는 S3로 대체된다 (10.6절).
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
