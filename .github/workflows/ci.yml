# 명세 11.5절
#
# 런타임 버전을 고정한다 — 로컬과 CI가 갈리면 "내 PC에서는 되는데" 문제가 생긴다.
#
# ⚠️ 명세는 Node 20 LTS를 지정했으나 Node 20은 2026년 4월 EOL이라 24 LTS로
#    올렸다. Next 16이 요구하는 최소치는 20.9.0이다.
#    docs/SPEC-NOTES.md "버전 정책" 항목 참고.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # REST 테스트는 실제 PostgreSQL을 쓴다 — FK 위반을 409로 감싸는 동작처럼
    # DB가 있어야만 검증되는 것들이 명세의 테스트 우선순위에 들어 있다.
    # 서비스가 없으면 해당 테스트가 조용히 건너뛰어져 통과한 것처럼 보인다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: subagent_viz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://user:pass@localhost:5432/subagent_viz_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # 테스트 도구는 requirements-dev.txt에 있고, 그 파일이 requirements.txt를
      # 포함하므로 한 줄이면 된다.
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/
      - run: ruff format --check backend/
      - run: pytest backend/tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Next 16에서 `next lint`가 제거되어 ESLint CLI를 직접 호출한다
      - run: npm run lint
      # next build에 tsc 타입체크가 포함된다
      - run: npm run build
