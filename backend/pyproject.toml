[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort — import 정렬
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 백엔드 모듈을 `import db` 처럼 최상위로 임포트할 수 있게 한다.
pythonpath = ["."]
